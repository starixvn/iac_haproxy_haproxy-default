frontend http_in_8088
    bind *:8088
    mode http
    option forwardfor
    #option dontlog-normal
    capture request header Host len 30
    capture request header User-Agent len 200
    capture request header Referer len 800
    capture request header X-Forwarded-For len 20
    stats enable
    stats uri /stats
    stats refresh 300s
    stats show-legends
    stats show-node
    stats auth nexcel:NexOps!QAZ

    ### check cluster Name
    acl is_cluster path -i /cluster-name
    http-request return status 200 content-type "text/plain" string "KLPROD" if is_cluster

    http-request use-service prometheus-exporter if { path /metrics }
    monitor-uri	/checkstatus
    use_backend %[path,lower,map_reg(/etc/haproxy/maps/nexus-licbotwebhook-klp-starixplay-com.map)] if { hdr(host) -i licbotwebhook-klp.starixplay.com -i licbotwebhook.starixplay.com }
    use_backend %[path,lower,map_reg(/etc/haproxy/maps/nexus-oddsfeed-webservice-klp-starixplay-com.map)] if { hdr(host) -i oddsfeed-webservice-klp.starixplay.com }
    use_backend %[req.hdr(host),lower,map_dom(/etc/haproxy/maps/hosts.map)]

default_backend nexops_default_backend_svc_be
