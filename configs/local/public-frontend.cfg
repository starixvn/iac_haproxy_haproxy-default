frontend public_telegrambot_LOCAL_fe
    bind *:6341 ssl crt /usr/local/etc/haproxy/nexdev.net.pem alpn h2,http/1.1
    mode http
    option forwardfor
    capture request header Host len 30
    capture request header User-Agent len 200
    capture request header Referer len 800
    capture request header X-Forwarded-For len 20
    option http-keep-alive
    http-request set-header X-Forwarded-Proto https if { ssl_fc }
    redirect scheme https code 301 if !{ ssl_fc }
    use_backend %[path,lower,map_reg(/etc/haproxy/maps/rome-special-subpath.map)] if { hdr(host) -i telegrambot-receiver.nexdev.net }
    use_backend %[path,lower,map_reg(/etc/haproxy/maps/nexus-licbot-nexdev-net.map)] if { hdr(host) -i licbot.nexdev.net }
    use_backend %[req.hdr(host),lower,map_dom(/etc/haproxy/maps/special-hosts.map)]
default_backend default_backend_nodes

