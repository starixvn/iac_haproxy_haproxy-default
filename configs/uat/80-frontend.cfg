frontend status-monitor
	bind *:8001
	monitor-uri	/checkstatus
   option dontlog-normal
   http-request use-service prometheus-exporter if { path /metrics }
default_backend default_backend_nodes

frontend http_in
   bind *:80
   mode http
   option dontlog-normal
   option forwardfor
   capture request header Host len 30
   capture request header User-Agent len 200
   capture request header Referer len 800
   capture request header X-Forwarded-For len 20
   stats enable
   stats uri /stats
   stats refresh 30s
   stats show-legends
   stats show-node
   stats auth nexcel:NexOps!QAZ

   use_backend %[path,lower,map_reg(/etc/haproxy/maps/uat-vg3-game-proxy.map)] if { hdr(host) -i uatproxy.vgamesuat.com }
   use_backend %[path,lower,map_reg(/etc/haproxy/maps/olympus-proxy-settle.map)] if { hdr(host) -i settle.starixuat.com }
   use_backend %[path,lower,map_reg(/etc/haproxy/maps/olympus-proxy-tvs.map)] if { hdr(host) -i tvs.starixuat.com }
   use_backend %[path,lower,map_reg(/etc/haproxy/maps/olympus-proxy-owp.map)] if { hdr(host) -i owp.starixuat.com }
   use_backend %[path,lower,map_reg(/etc/haproxy/maps/olympus-riskcontrol-starixuat-com.map)] if { hdr(host) -i riskcontrol.starixuat.com }
   #http-request redirect code 301 location https://l2sitapi.sgamesuat.com%[capture.req.uri] if { hdr_dom(host) -m end sitapi.vgamesuat.com }
   use_backend %[path,lower,map_reg(/etc/haproxy/maps/rome-i1mb1-starixuat-com.map)] if { hdr(host) -i i1mb1.starixuat.com }
    use_backend %[path,lower,map_reg(/etc/haproxy/maps/rome-i1mb10-starixuat-com.map)] if { hdr(host) -i i1mb10.starixuat.com }
    use_backend %[path,lower,map_reg(/etc/haproxy/maps/rome-i7mb1-starixuat-com.map)] if { hdr(host) -i i7mb1.starixuat.com }
    use_backend %[path,lower,map_reg(/etc/haproxy/maps/rome-i7mb2-starixuat-com.map)] if { hdr(host) -i i7mb2.starixuat.com }
    use_backend %[path,lower,map_reg(/etc/haproxy/maps/rome-i7mb3-starixuat-com.map)] if { hdr(host) -i i7mb3.starixuat.com }
    use_backend %[path,lower,map_reg(/etc/haproxy/maps/rome-i7mb4-starixuat-com.map)] if { hdr(host) -i i7mb4.starixuat.com }
    use_backend %[path,lower,map_reg(/etc/haproxy/maps/rome-i7mb5-starixuat-com.map)] if { hdr(host) -i i7mb5.starixuat.com }
    use_backend %[path,lower,map_reg(/etc/haproxy/maps/rome-i1mb2-starixuat-com.map)] if { hdr(host) -i i1mb2.starixuat.com }
    use_backend %[path,lower,map_reg(/etc/haproxy/maps/rome-i1mb3-starixuat-com.map)] if { hdr(host) -i i1mb3.starixuat.com }
    use_backend %[path,lower,map_reg(/etc/haproxy/maps/rome-i1mb4-starixuat-com.map)] if { hdr(host) -i i1mb4.starixuat.com }
    use_backend %[path,lower,map_reg(/etc/haproxy/maps/rome-i1mb5-starixuat-com.map)] if { hdr(host) -i i1mb5.starixuat.com }
    use_backend %[path,lower,map_reg(/etc/haproxy/maps/rome-i1mb6-starixuat-com.map)] if { hdr(host) -i i1mb6.starixuat.com }
    use_backend %[path,lower,map_reg(/etc/haproxy/maps/rome-i1mb7-starixuat-com.map)] if { hdr(host) -i i1mb7.starixuat.com }
    use_backend %[path,lower,map_reg(/etc/haproxy/maps/rome-i1mb8-starixuat-com.map)] if { hdr(host) -i i1mb8.starixuat.com }
    use_backend %[path,lower,map_reg(/etc/haproxy/maps/rome-i1mb9-starixuat-com.map)] if { hdr(host) -i i1mb9.starixuat.com }
    use_backend %[req.hdr(host),lower,map_dom(/etc/haproxy/maps/hosts.map)]

default_backend default_backend_nodes
