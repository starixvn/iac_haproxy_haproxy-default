frontend status-monitor
	bind *:8001
	monitor-uri	/checkstatus

frontend http_in
    bind *:80
    mode http
    option forwardfor
    option httplog
    capture request header Host len 30
    capture request header User-Agent len 200
    capture request header Referer len 800
    capture request header X-Forwarded-For len 20
    option http-keep-alive
    http-request use-service prometheus-exporter if { path /metrics }
    stats enable
    stats uri /stats
    stats refresh 300s
    stats show-legends
    stats show-node
    stats auth nexcel:NexOps!QAZ
    #acl is_well_known path_beg -i /.well-known/
    #redirect scheme https code 301 if !is_well_known !{ ssl_fc }
    #use_backend letsencrypt if is_well_known
    use_backend sabavn_um if { hdr(host) -i saba.vn }
    use_backend sabavn_um if { hdr(host) -i saba.vn www.saba.vn }
    #use_backend nexus_saba_sports_saba_news_site_GC_1_be if { hdr(host) -i staging.sabavn.net }
    ####
    #http-request set-header X-Client-IP %[req.hdr_ip(X-Forwarded-For)]
    acl is_whitelisted_ip hdr_ip(x-forwarded-for,1) -f /etc/haproxy/whitelisted.ips
    acl is_whitelisted_ip src -m ip -f /etc/haproxy/whitelisted.ips
    acl internal_domains hdr(host) -i staging.sabavn.net 
    http-request deny if internal_domains !is_whitelisted_ip
    ####

    # redirect sabavn.net to www.saba.news
    acl sabavn_net hdr_dom(host) -i sabavn.net
    http-request redirect code 301 location https://www.saba.news%[capture.req.uri] if sabavn_net

    use_backend %[req.hdr(host),lower,map_dom(/etc/haproxy/maps/hosts.map)]
    #ttp-request redirect code 301 location https://www.sabavn.com%[capture.req.uri] if { hdr_dom(host) -m end vn.sabasports.com }
    # http-request redirect code 301 location https://sabavn.com%[capture.req.uri] if { hdr_dom(host) -m end sabavn.net }
    # http-request redirect code 301 location https://www.sabavn.com%[capture.req.uri] if { hdr_dom(host) -m end www.sabavn.net }




default_backend nexus_saba_sports_saba_news_site_GC_be
