frontend status-monitor
	bind *:8001
	monitor-uri	/checkstatus
    http-request use-service prometheus-exporter if { path /metrics }
default_backend default_backend_nodes

frontend http_in
    bind *:80
    mode http
    option forwardfor
    option httplog
    capture request header Host len 30
    capture request header User-Agent len 200
    capture request header Referer len 800
    capture request header X-Forwarded-For len 20
    #http-request redirect scheme https unless { ssl_fc }
    #http-request redirect scheme https code 301 unless { ssl_fc }
    #http-request redirect code 301 location https://www.saba.vn%[capture.req.uri] if { hdr_dom(host) -m end vn.sabasports.com }
    option http-keep-alive
    stats enable
    stats uri /stats
    stats refresh 300s
    stats show-legends
    stats show-node
    stats auth nexcel:1qaz@WSX
    ###
    acl is_well_known path_beg -i /.well-known/
    # else redirect the traffic to https
    #redirect scheme https code 301 if !is_well_known !{ ssl_fc }
    use_backend letsencrypt if is_well_known
    use_backend nexus_saba_sports_saba_news_site_GC_be if { hdr(host) -i saba.vn }
    use_backend nexus_saba_sports_saba_news_site_GC_be if { hdr(host) -i www.sabavn.com }
    use_backend nexus_saba_sports_saba_news_site_GC_be if { hdr(host) -i sabavn.com }
    use_backend nexus_saba_sports_saba_news_site_GC_be if { hdr(host) -i www.sabavn.net }
    use_backend nexus_saba_sports_saba_news_site_GC_be if { hdr(host) -i sabavn.net }
    use_backend nexus_saba_sports_saba_news_upload_GC_be if { hdr(host) -i cdn.sabavn.com }
    use_backend nexus_saba_sports_saba_news_wp_GC_be if { hdr(host) -i admin.sabavn.com }
    use_backend %[req.hdr(host),lower,map_dom(/etc/haproxy/maps/hosts.map)]
    http-request redirect code 301 location https://saba.vn%[capture.req.uri] if { hdr_dom(host) -m end vn.sabasports.com }
    http-request redirect prefix https://%[hdr(host),regsub(^www\.,,i)] code 301 if { hdr_beg(host) -i www. }
    
default_backend default_backend_nodes
