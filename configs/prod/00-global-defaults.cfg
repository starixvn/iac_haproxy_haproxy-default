global
    maxconn 500000
    log 10.99.27.210:514 len 8096 local2
    chroot       /var/lib/haproxy
    pidfile      /var/run/haproxy.pid
    user         haproxy
    group        haproxy
    stats socket /var/lib/haproxy/stats expose-fd listeners
    stats socket /var/run/haproxy.sock user haproxy group haproxy mode 660 level admin expose-fd listeners
    master-worker

resolvers docker
    nameserver dns1 127.0.0.11:53
    resolve_retries 5
    timeout resolve 2s
    timeout retry   2s
    hold other      10s
    hold refused    10s
    hold nx         10s
    hold timeout    10s
    hold valid      10s
    hold obsolete   10s

defaults
    mode http
    log global
    compression algo gzip
    compression type text/css text/html text/javascript application/javascript text/plain text/xml application/json application/x-msgpack application/octet-stream
    option httplog
    option  http-server-close
    option  dontlognull
    option  redispatch
    option  contstats
    retries 5
    backlog 10000
    maxconn 20000
    timeout connect 10s
    timeout client 5m
    timeout server 5m
    timeout tunnel        3600s
    timeout http-keep-alive  10s
    timeout http-request    300s
    timeout queue           30s
    timeout tarpit          60s
    default-server inter 3s rise 2 fall 3

backend default_backend_nodes
    http-request return status 503 content-type "text/plain"  lf-string "503 Service Unavailable ! Pls contact NexOps if you think this is a mistake..."

backend empty_backend_nodes
    http-request return status 200 content-type "text/plain"  lf-string "I'm ok."
backend um_backend_nodes
    option httpchk GET /
    http-check expect status 200
    acl not_found status 404
    http-response redirect code 302 location https://saba.vn if not_found
    server nexops_um 10.2.190.79:8550 check
