frontend status-monitor
	bind *:8001
	monitor-uri	/checkstatus
    http-request use-service prometheus-exporter if { path /metrics }
default_backend default_backend_nodes

frontend http_in
    bind *:80
    mode http
    http-request use-service prometheus-exporter if { path /metrics }
    option forwardfor

use_backend %[path,map_beg(/etc/haproxy/maps/olympus-proxy-settle.map)] if { hdr(host) -i settle.playthefun.com }
use_backend %[path,map_beg(/etc/haproxy/maps/olympus-proxy-tvs.map)] if { hdr(host) -i tvs.playthefun.com }
use_backend %[req.hdr(host),lower,map_dom(/etc/haproxy/maps/hosts.map)]
default_backend default_backend_nodes
