frontend http_in_8088
    bind *:8088
    mode http
    stats enable
    stats uri /stats
    stats refresh 30s
    stats show-legends
    stats show-node
    stats auth nexcel:NexOps!QAZ
    option forwardfor
    http-request use-service prometheus-exporter if { path /metrics }
    use_backend %[path,lower,map_reg(/etc/haproxy/maps/rome-vn-customer-int-playonesit-com.map)] if { hdr(host) -i vn-customer-int.playonesit.com }
    use_backend %[path,lower,map_reg(/etc/haproxy/maps/rome-cdn-customer-playonesit-com.map)] if { hdr(host) -i cdn-customer.playonesit.com }
    use_backend %[req.hdr(host),lower,map_dom(/etc/haproxy/maps/hosts.map)]
default_backend default_backend_nodes
