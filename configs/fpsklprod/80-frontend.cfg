frontend status-monitor
	bind *:8001
	monitor-uri	/checkstatus

frontend http_in
    bind *:80
    mode http
    option forwardfor
    option dontlog-normal
    option httplog
    capture request header Host len 46
    capture request header User-Agent len 200
    capture request header Referer len 800
    capture request header X-Forwarded-For len 20
    option http-keep-alive
    stats enable
    stats uri /stats
    stats refresh 300s
    stats show-legends
    stats show-node
    stats auth nexcel:NexOps!QAZ

    ### check cluster Name
    acl is_cluster path -i /cluster-name
    http-request return status 200 content-type "text/plain" string "KLPROD" if is_cluster

    ###
    use_backend %[path,lower,map_reg(/etc/haproxy/maps/spu-fps-evo-api-klp-starix-fpsklprod-gamora-prod.map)] if { hdr(host) -i fps-evo-api-klp.starix-fpsklprod.gamora.prod -i fps-evo-api-klp.starixplay.com -i fps-evo-api.oneops.net }
    use_backend %[req.hdr(host),lower,map_dom(/etc/haproxy/maps/hosts.map)]

default_backend nexops_default_backend_svc_be
