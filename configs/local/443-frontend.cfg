    use_backend %[path,lower,map_reg(/etc/haproxy/maps/rome-mbp11-nexdev-net.map)] if { hdr(host) -i mbp11.nexdev.net -i indp2.nexdev.net -i intp2.nexdev.net -i intp21.nexdev.net -i intp22.nexdev.net }
