frontend status-monitor
	bind *:8001
    mode http
	monitor-uri	/checkstatus

frontend http_in
    bind *:80
    mode http
    option forwardfor
    capture request header Host len 30
    capture request header User-Agent len 200
    capture request header Referer len 800
    capture request header X-Forwarded-For len 20
    option http-keep-alive
    option dontlog-normal
    stats enable
    stats uri /stats
    stats refresh 300s
    stats show-legends
    stats show-node
    stats auth nexcel:NexOps!QAZ
    ###    
    use_backend nexus_nexcel_redmine_PROD_be if { hdr(host) -i nexdev.net }
    use_backend %[path,lower,map_reg(/etc/haproxy/maps/olympus-proxy-owp.map)] if { hdr(host) -i owp.nexdev.net }
    use_backend %[path,lower,map_reg(/etc/haproxy/maps/vg3-game-proxy.map)] if { hdr(host) -i l3-api-proxy.nexdev.net }
    use_backend %[path,lower,map_reg(/etc/haproxy/maps/spu-fpsapi-nexdev-net.map)] if { hdr(host) -i fpsapi.nexdev.net }
    use_backend %[path,lower,map_reg(/etc/haproxy/maps/rome-mb2-nexdev-net.map)] if { hdr(host) -i mb2.nexdev.net }
    use_backend %[path,lower,map_reg(/etc/haproxy/maps/rome-mb3-nexdev-net.map)] if { hdr(host) -i mb3.nexdev.net }
    use_backend %[path,lower,map_reg(/etc/haproxy/maps/rome-mb4-nexdev-net.map)] if { hdr(host) -i mb4.nexdev.net }
    use_backend %[path,lower,map_reg(/etc/haproxy/maps/rome-telegrambot-receiver-nexdev-net.map)] if { hdr(host) -i telegrambot-receiver.nexdev.net }
    use_backend %[path,lower,map_reg(/etc/haproxy/maps/rome-customer-nexdev-net.map)] if { hdr(host) -i customer.nexdev.net }
    use_backend %[path,lower,map_reg(/etc/haproxy/maps/nexops-sample-website2-nexdev-net.map)] if { hdr(host) -i sample-website2.nexdev.net }
    use_backend %[path,lower,map_reg(/etc/haproxy/maps/rome-ext-gateways-nexdev-net.map)] if { hdr(host) -i ext-gateways.nexdev.net }
    use_backend %[path,lower,map_reg(/etc/haproxy/maps/rome-alpha-gateways-nexdev-net.map)] if { hdr(host) -i alpha-gateways.nexdev.net }
    use_backend %[path,lower,map_reg(/etc/haproxy/maps/spu-fps-job-api-nexdev-net.map)] if { hdr(host) -i fps-job-api.nexdev.net }
    use_backend %[path,lower,map_reg(/etc/haproxy/maps/nexops-sample1-nexdev-net.map)] if { hdr(host) -i sample1.nexdev.net -i sample2.nexdev.net }
    use_backend %[path,lower,map_reg(/etc/haproxy/maps/rome-cdn-customer-nexdev-net.map)] if { hdr(host) -i cdn-customer.nexdev.net }
    use_backend %[path,lower,map_reg(/etc/haproxy/maps/spu-fpsjob-nexdev-net.map)] if { hdr(host) -i fpsjob.nexdev.net }
    use_backend %[path,lower,map_reg(/etc/haproxy/maps/spu-fpsjob2-nexdev-net.map)] if { hdr(host) -i fpsjob2.nexdev.net }
    use_backend %[path,lower,map_reg(/etc/haproxy/maps/nexops-rocketor-test-nexdev-net.map)] if { hdr(host) -i rocketor-test.nexdev.net }
    use_backend %[path,lower,map_reg(/etc/haproxy/maps/spu-dmmpacdatashift-sai-nexdev-net.map)] if { hdr(host) -i dmmpacdatashift-sai.nexdev.net }
    use_backend %[path,lower,map_reg(/etc/haproxy/maps/rome-las-nexdev-net.map)] if { hdr(host) -i las.nexdev.net }
    use_backend %[path,lower,map_reg(/etc/haproxy/maps/rome-dep-api-gw-nexdev-net.map)] if { hdr(host) -i dep-api-gw.nexdev.net }
    use_backend %[req.hdr(host),lower,map_dom(/etc/haproxy/maps/hosts.map)]
default_backend default_backend_nodes
