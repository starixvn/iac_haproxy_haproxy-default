frontend https_in
    bind *:443 ssl crt /usr/local/etc/haproxy/nexdev.net.pem alpn h2,http/1.1 crt /usr/local/etc/haproxy/nexcel.vn.pem alpn h2,http/1.1
    mode http
    option forwardfor
    capture request header Host len 30
    capture request header User-Agent len 200
    capture request header Referer len 800
    capture request header X-Forwarded-For len 20
    option http-keep-alive
    http-request set-header X-Forwarded-Proto https if { ssl_fc }
    redirect scheme https code 301 if !{ ssl_fc }
    stats uri /stats
    stats refresh 300s
    stats show-legends
    stats show-node
    stats auth nexcel:1qaz@WSX
    #
    use_backend %[path,map_beg(/etc/haproxy/vg3-game-proxy.map)] if { hdr(host) -i l3-api-proxy.nexdev.net }
    use_backend %[req.hdr(host),lower,map_dom(/etc/haproxy/hosts.map)]
default_backend default_backend_nodes
