frontend status-monitor
	bind *:8001
	monitor-uri	/checkstatus

frontend http_in_alpha
    bind *:80
    mode http
    option forwardfor
    option httplog
    option dontlog-normal
    capture request header Host len 30
    capture request header User-Agent len 200
    capture request header Referer len 800
    capture request header X-Forwarded-For len 20
    option http-keep-alive
    stats enable
    stats uri /stats
    stats refresh 300s
    stats show-legends
    stats show-node
    stats auth nexcel:NexOps!QAZ
    ###
    use_backend %[path,lower,map_reg(/etc/haproxy/maps/mbc-int.byb6181.com.map)] if { hdr(host) -i mbc-int.byb6181.com }
    use_backend %[path,lower,map_reg(/etc/haproxy/maps/rome-mbc-mb-byb6181-com.map)] if { hdr(host) -i mbc-mb.byb6181.com -i th7-mb.byb6181.com -i 777-mb.byb6181.com -i mbc-mb2.byb6181.com }
    use_backend %[path,lower,map_reg(/etc/haproxy/maps/rome-789y-mb-byb6181-com.map)] if { hdr(host) -i 789y-mb.byb6181.com -i 789y-mb2.byb6181.com -i 789y-int.byb6181.com }
    use_backend %[path,lower,map_reg(/etc/haproxy/maps/rome-api-byb6181-com.map)] if { hdr(host) -i api.byb6181.com }
    use_backend %[path,lower,map_reg(/etc/haproxy/maps/rome-indo-mb-byb6181-com.map)] if { hdr(host) -i indo-mb.byb6181.com -i indo-mb2.byb6181.com }
    use_backend %[path,lower,map_reg(/etc/haproxy/maps/rome-mbc-int-byb6181-com.map)] if { hdr(host) -i mbc-int.byb6181.com }
    use_backend %[path,lower,map_reg(/etc/haproxy/maps/rome-789y-int-byb6181-com.map)] if { hdr(host) -i 789y-int.byb6181.com }
    use_backend %[path,lower,map_reg(/etc/haproxy/maps/rome-indo-int-byb6181-com.map)] if { hdr(host) -i indo-int.byb6181.com }
    use_backend %[req.hdr(host),lower,map_dom(/etc/haproxy/maps/hosts.map)]

default_backend default_backend_nodes
