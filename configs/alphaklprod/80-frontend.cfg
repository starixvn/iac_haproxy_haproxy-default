frontend status-monitor
	bind *:8001
	monitor-uri	/checkstatus

frontend http_in_alpha
    bind *:80
    mode http
    option forwardfor
    option httplog
    capture request header Host len 42
    capture request header User-Agent len 200
    capture request header Referer len 800
    capture request header X-Forwarded-For len 20
    option http-keep-alive
    stats enable
    stats uri /stats
    stats refresh 300s
    stats show-legends
    stats show-node
    stats auth nexcel:NexOps!QAZ

    ### check cluster Name
    acl is_cluster path -i /cluster-name
    http-request return status 200 content-type "text/plain" string "KLPROD" if is_cluster

