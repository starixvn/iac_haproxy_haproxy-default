global
    maxconn 50000
    log fd@2 local2
    chroot       /var/lib/haproxy
    pidfile      /var/run/haproxy.pid
    user         haproxy
    group        haproxy
    stats socket /var/lib/haproxy/stats expose-fd listeners
    stats socket /var/run/haproxy.sock user haproxy group haproxy mode 660 level admin expose-fd listeners
    master-worker

resolvers docker
    nameserver dns1 127.0.0.11:53
    resolve_retries 3
    timeout resolve 1s
    timeout retry   1s
    hold other      10s
    hold refused    10s
    hold nx         10s
    hold timeout    10s
    hold valid      10s
    hold obsolete   10s

defaults
    mode http
    compression algo gzip
    compression type text/css text/html text/javascript application/javascript text/plain text/xml application/json application/x-msgpack application/octet-stream
    log global
    option httplog
    option  http-server-close
    #option dontlog-normal
    option  dontlognull
    option  redispatch
    option  contstats
    retries 5
    backlog 10000
    maxconn 50000
    timeout connect 10s
    timeout client 5m
    timeout server 5m
    timeout tunnel        3600s
    timeout http-keep-alive  10s
    timeout http-request    15s
    timeout queue           30s
    timeout tarpit          60s
    default-server inter 3s rise 5 fall 3

backend default_backend_nodes
    http-request return status 503 content-type "text/plain"  lf-string "503 Service Unavailable ! Pls contact NexOps if you think this is a mistake...GPC"

backend empty_backend_nodes
    http-request return status 200 content-type "text/plain"  lf-string "I'm ok. GPC"

backend um_backend_nodes
    option httpchk GET /
    http-check expect status 200
    #acl not_found status 404
    #http-response redirect code 302 location https://saba.vn if not_found
    server nexops_um 10.10.10.3:8550 check
# LE Backend
backend letsencrypt
    server letsencrypt 10.10.10.3:8551 resolvers docker check init-addr none
