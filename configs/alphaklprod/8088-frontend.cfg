frontend http_in_8088_alpha
    bind *:8088
    mode http
    option forwardfor
    option httplog
    option dontlog-normal
    capture request header Host len 30
    capture request header User-Agent len 200
    capture request header Referer len 800
    capture request header X-Forwarded-For len 20
    option http-keep-alive
    stats enable
    stats uri /stats
    stats refresh 300s
    stats show-legends
    stats show-node
    stats auth nexcel:NexOps!QAZ
    ###
    use_backend %[path,lower,map_reg(/etc/haproxy/maps/olympus-onebookum-starix-alphaklprod-gamora-prod.map)] if { hdr(host) -i onebookum.starix-alphaklprod.gamora.prod }
    use_backend %[path,lower,map_reg(/etc/haproxy/maps/rome-mb-bt1789-com.map)] if { hdr(host) -i mb.bt1789.com -i mb2.bt1789.com }
    use_backend %[path,lower,map_reg(/etc/haproxy/maps/rome-mb-bth788-com.map)] if { hdr(host) -i mb.bth788.com -i mb2.bth788.com }
    use_backend %[path,lower,map_reg(/etc/haproxy/maps/rome-mb-bth688-com.map)] if { hdr(host) -i mb.bth688.com -i mb2.bth688.com }
    use_backend %[path,lower,map_reg(/etc/haproxy/maps/rome-789y-int-klp-starixplay-com.map)] if { hdr(host) -i 789y-int-klp.starixplay.com }
    use_backend %[path,lower,map_reg(/etc/haproxy/maps/rome-indo-int-klp-starixplay-com.map)] if { hdr(host) -i indo-int-klp.starixplay.com }
    use_backend %[req.hdr(host),lower,map_dom(/etc/haproxy/maps/hosts.map)]

default_backend nexops_default_backend_svc_be
