frontend public_fps_fpt_UAT_fe
    bind *:6012
    #mode http
    option forwardfor
    #capture request header Host len 30
    #capture request header User-Agent len 200
    #capture request header Referer len 800
    #capture request header X-Forwarded-For len 20
    default_backend spu_fps_fp_gateway_api_service_UAT_be

frontend public_fps_fpt_http_UAT_fe
    bind *:6013
    #mode http
    option forwardfor
    #capture request header Host len 30
    #capture request header User-Agent len 200
    #capture request header Referer len 800
    #capture request header X-Forwarded-For len 20
    default_backend spu_fps_fp_gateway_api_service_UAT_be