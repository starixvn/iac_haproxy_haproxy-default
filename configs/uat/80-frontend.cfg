frontend status-monitor
	bind *:8001
	monitor-uri	/checkstatus
   http-request use-service prometheus-exporter if { path /metrics }
default_backend default_backend_nodes

frontend http_in
   bind *:80
   mode http
   option forwardfor
   capture request header Host len 30
   capture request header User-Agent len 200
   capture request header Referer len 800
   capture request header X-Forwarded-For len 20
   stats enable
   stats uri /stats
   stats refresh 30s
   stats show-legends
   stats show-node
   stats auth nexcel:1qaz@WSX

   use_backend %[path,map_beg(/etc/haproxy/maps/uat-vg3-game-proxy.map)] if { hdr(host) -i uatproxy.vgamesuat.com }
   use_backend %[path,map_beg(/etc/haproxy/maps/olympus-proxy-settle.map)] if { hdr(host) -i settle.starixuat.com }
   use_backend %[path,map_beg(/etc/haproxy/maps/olympus-proxy-tvs.map)] if { hdr(host) -i tvs.starixuat.com }
   use_backend rome_alpha_i1_reports_UAT_be if { path_beg /site-reports/ } { hdr(host) -i i1mb1.starixuat.com }
   use_backend rome_alpha_i7_reports_UAT_be if { path_beg /site-reports/ } { hdr(host) -i i7mb1.starixuat.com }
   use_backend rome_alpha_reports_UAT_3_be if { path_beg /site-reports/ } { hdr(host) -i i1mb3.starixuat.com }
   use_backend rome_alpha_reports_UAT_4_be if { path_beg /site-reports/ } { hdr(host) -i i1mb4.starixuat.com }
   use_backend rome_alpha_reports_UAT_5_be if { path_beg /site-reports/ } { hdr(host) -i i1mb5.starixuat.com }
   use_backend rome_alpha_reports_UAT_6_be if { path_beg /site-reports/ } { hdr(host) -i i1mb6.starixuat.com }
   use_backend rome_alpha_reports_UAT_7_be if { path_beg /site-reports/ } { hdr(host) -i i1mb7.starixuat.com }
   use_backend rome_alpha_reports_UAT_8_be if { path_beg /site-reports/ } { hdr(host) -i i1mb8.starixuat.com }
   use_backend rome_alpha_reports_UAT_9_be if { path_beg /site-reports/ } { hdr(host) -i i1mb9.starixuat.com }
   use_backend rome_alpha_reports_UAT_10_be if { path_beg /site-reports/ } { hdr(host) -i i1mb10.starixuat.com }
   use_backend %[req.hdr(host),lower,map_dom(/etc/haproxy/maps/hosts.map)]

default_backend default_backend_nodes
