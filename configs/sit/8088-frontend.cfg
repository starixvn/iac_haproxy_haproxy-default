frontend http_in_8088
    bind *:8088
    mode http
    stats enable
    stats uri /stats
    stats refresh 30s
    stats show-legends
    stats show-node
    stats auth nexcel:NexOps!QAZ
    option forwardfor
    option dontlog-normal
    capture request header Host len 30
    capture request header User-Agent len 200
    capture request header Referer len 800
    capture request header X-Forwarded-For len 20
    http-request use-service prometheus-exporter if { path /metrics }
    use_backend %[path,lower,map_reg(/etc/haproxy/maps/rome-vn-customer-int-playonesit-com.map)] if { hdr(host) -i vn-customer-int.playonesit.com }
    use_backend %[path,lower,map_reg(/etc/haproxy/maps/rome-cdn-customer-playonesit-com.map)] if { hdr(host) -i cdn-customer.playonesit.com }
    use_backend %[path,lower,map_reg(/etc/haproxy/maps/nexus-licbot-playonesit-com.map)] if { hdr(host) -i licbot.playonesit.com }
    use_backend %[path,lower,map_reg(/etc/haproxy/maps/legion-deposit-api-gw-playonesit-com.map)] if { hdr(host) -i deposit-api-gw.playonesit.com -i deposit-api-gw.nebula.sit }
    use_backend %[path,lower,map_reg(/etc/haproxy/maps/rome-mbp1-playonesit-com.map)] if { hdr(host) -i mbp1.playonesit.com -i idp1.playonesit.com }
    use_backend %[path,lower,map_reg(/etc/haproxy/maps/rome-vn-dep-api-gw-playonesit-com.map)] if { hdr(host) -i vn-dep-api-gw.playonesit.com -i vn-dep-api-gw-int.playonesit.com -i vn-dep-api-gw-int.nebula.sit }
    use_backend %[path,lower,map_reg(/etc/haproxy/maps/rome-mbp3-playonesit-com.map)] if { hdr(host) -i mbp3.playonesit.com -i idp2.playonesit.com }
    use_backend %[path,lower,map_reg(/etc/haproxy/maps/rome-mbp4-playonesit-com.map)] if { hdr(host) -i mbp4.playonesit.com }
    use_backend %[path,lower,map_reg(/etc/haproxy/maps/rome-mbp5-playonesit-com.map)] if { hdr(host) -i mbp5.playonesit.com -i idp3.playonesit.com }
    use_backend %[path,lower,map_reg(/etc/haproxy/maps/rome-mbp2-playonesit-com.map)] if { hdr(host) -i mbp2.playonesit.com }
    use_backend %[path,lower,map_reg(/etc/haproxy/maps/rome-vn-bet-limit-int-playonesit-com.map)] if { hdr(host) -i vn-bet-limit-int.playonesit.com -i vn-bet-limit.playonesit.com }
    use_backend %[path,lower,map_reg(/etc/haproxy/maps/rome-nap-hub-playonesit-com.map)] if { hdr(host) -i nap-hub.playonesit.com }
    use_backend %[path,lower,map_reg(/etc/haproxy/maps/legion-lap-betlist-api-nebula-sit.map)] if { hdr(host) -i lap-betlist-api.nebula.sit }
    use_backend %[path,lower,map_reg(/etc/haproxy/maps/rome-vn-agencycash-api-nebula-sit.map)] if { hdr(host) -i vn-agencycash-api.nebula.sit -i vn-agencycash-api.playonesit.com }
    use_backend %[path,lower,map_reg(/etc/haproxy/maps/nexops-t1-lumigame-com.map)] if { hdr(host) -i t1.lumigame.com -i t1.lumigame.com }
    use_backend %[path,lower,map_reg(/etc/haproxy/maps/rome-mbp6-vn-st-playonesit-com.map)] if { hdr(host) -i mbp6.vn-st.playonesit.com }
    use_backend %[path,lower,map_reg(/etc/haproxy/maps/rome-mbp10-vn-st-playonesit-com.map)] if { hdr(host) -i mbp10.vn-st.playonesit.com }
    use_backend %[path,lower,map_reg(/etc/haproxy/maps/rome-mbp11-vn-st-playonesit-com.map)] if { hdr(host) -i mbp11.vn-st.playonesit.com }
    use_backend %[path,lower,map_reg(/etc/haproxy/maps/rome-mbp12-vn-st-playonesit-com.map)] if { hdr(host) -i mbp12.vn-st.playonesit.com }
    use_backend %[path,lower,map_reg(/etc/haproxy/maps/rome-mbp7-vn-st-playonesit-com.map)] if { hdr(host) -i mbp7.vn-st.playonesit.com }
    use_backend %[path,lower,map_reg(/etc/haproxy/maps/rome-mbp8-vn-st-playonesit-com.map)] if { hdr(host) -i mbp8.vn-st.playonesit.com }
    use_backend %[path,lower,map_reg(/etc/haproxy/maps/rome-mbp9-vn-st-playonesit-com.map)] if { hdr(host) -i mbp9.vn-st.playonesit.com }
    use_backend %[req.hdr(host),lower,map_dom(/etc/haproxy/maps/hosts.map)]
default_backend default_backend_nodes
