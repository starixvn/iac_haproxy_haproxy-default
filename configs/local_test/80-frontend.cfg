frontend status-monitor
	bind *:8001
	monitor-uri	/checkstatus
    #http-request use-service prometheus-exporter if { path /metrics }
default_backend default_backend_nodes

frontend http_in
    bind *:80
    bind :443 ssl crt /etc/haproxy/nexdev.net.pem alpn h2
    #bind quic4@:443 ssl crt /etc/haproxy/nexdev.net.pem alpn h3
    mode http
    option forwardfor
    capture request header Host len 30
    capture request header User-Agent len 200
    capture request header Referer len 800
    capture request header X-Forwarded-For len 20
    #option http-keep-alive
    stats enable
    stats uri /stats
    stats refresh 30s
    #stats show-legends
    #stats show-node
    stats auth nexcel:1qaz@WSX

    #NexOps
    #http-request redirect scheme https if { hdr(host) -i api.haproxydev.local }
    #http-request redirect scheme https if { hdr(host) -i www.haproxydev.local }
    use_backend be_www if { hdr(host) -i haproxydev.local }
    #acl is_whitelisted_ip src -f /etc/haproxy/whitelisted.ips
    acl internal_domains hdr(host) -i nginx.haproxydev.local
    http-request deny if internal_domains !is_whitelisted_ip
    #http-request deny if internal_domains !is_whitelisted_ip
    #use_backend %[path,map_beg(/etc/haproxy/maps/l2-game-proxy.map)] if { hdr(host) -i l2-proxy.lumigame.com }
    use_backend %[req.hdr(host),lower,map_dom(/etc/haproxy/maps/hosts.map)]
    
default_backend default_backend_nodes
