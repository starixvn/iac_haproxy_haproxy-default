
frontend https_in
    bind *:443 ssl crt /usr/local/etc/haproxy/nexdev.net.pem alpn h2,http/1.1 crt /usr/local/etc/haproxy/nexcel.vn.pem alpn h2,http/1.1 crt /usr/local/etc/haproxy/nexcel.info.pem alpn h2,http/1.1
    mode http
    option forwardfor
    option http-keep-alive
    http-request set-header X-Forwarded-Proto https if { ssl_fc }
    redirect scheme https code 301 if !{ ssl_fc }
    stats uri /stats
    stats refresh 300s
    stats show-legends
    stats show-node
    stats auth nexcel:1qaz@WSX
    use_backend nexus_nexcel_redmine_PROD_be if { hdr(host) -i nexdev.net }
    use_backend %[path,lower,map_reg(/etc/haproxy/maps/olympus-proxy.map)] if { hdr(host) -i settle.nexdev.net }
    use_backend %[path,lower,map_reg(/etc/haproxy/maps/olympus-proxy-tvs.map)] if { hdr(host) -i tvs.nexdev.net }
    use_backend %[path,lower,map_reg(/etc/haproxy/maps/olympus-proxy-owp.map)] if { hdr(host) -i owp.nexdev.net }
    use_backend %[path,lower,map_reg(/etc/haproxy/maps/vg3-game-proxy.map)] if { hdr(host) -i l3-api-proxy.nexdev.net }    
    use_backend %[path,lower,map_reg(/etc/haproxy/maps/spu-fpsapi-nexdev-net.map)] if { hdr(host) -i fpsapi.nexdev.net }
    use_backend %[path,lower,map_reg(/etc/haproxy/maps/olympus-riskcontrol-nexdev-net.map)] if { hdr(host) -i riskcontrol.nexdev.net }
    use_backend %[path,lower,map_reg(/etc/haproxy/maps/nexops-sample-nexdev-net.map)] if { hdr(host) -i sample.nexdev.net }
    use_backend %[path,lower,map_reg(/etc/haproxy/maps/nexops-website-demo2.map)] if { hdr(host) -i website-demo2.nexdev.net }
    use_backend %[path,lower,map_reg(/etc/haproxy/maps/rome-mb2-nexdev-net.map)] if { path_beg /site-betlists/ } { hdr(host) -i mb2.nexdev.net }
    use_backend %[req.hdr(host),lower,map_dom(/etc/haproxy/maps/hosts.map)]
default_backend default_backend_nodes
