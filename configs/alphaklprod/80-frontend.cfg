frontend status-monitor
	bind *:8001
	monitor-uri	/checkstatus

frontend http_in_alpha
    bind *:80
    mode http
    option forwardfor
    option httplog
    capture request header Host len 42
    capture request header User-Agent len 200
    capture request header Referer len 800
    capture request header X-Forwarded-For len 20
    option http-keep-alive
    stats enable
    stats uri /stats
    stats refresh 300s
    stats show-legends
    stats show-node
    stats auth nexcel:NexOps!QAZ
    ###
    use_backend %[path,lower,map_reg(/etc/haproxy/maps/olympus-onebookum-starix-alphaklprod-gamora-prod.map)] if { hdr(host) -i onebookum.starix-alphaklprod.gamora.prod }
    use_backend %[path,lower,map_reg(/etc/haproxy/maps/rome-mb-bt1789-com.map)] if { hdr(host) -i mb.bt1789.com -i mb2.bt1789.com }
    use_backend %[path,lower,map_reg(/etc/haproxy/maps/rome-mb-bth788-com.map)] if { hdr(host) -i mb.bth788.com -i mb2.bth788.com }
    use_backend %[path,lower,map_reg(/etc/haproxy/maps/rome-mb-bth688-com.map)] if { hdr(host) -i mb.bth688.com -i mb2.bth688.com }
    use_backend %[path,lower,map_reg(/etc/haproxy/maps/rome-789y-int-klp-starixplay-com.map)] if { hdr(host) -i 789y-int-klp.starixplay.com }
    use_backend %[path,lower,map_reg(/etc/haproxy/maps/rome-indo-int-klp-starixplay-com.map)] if { hdr(host) -i indo-int-klp.starixplay.com }
    use_backend %[path,lower,map_reg(/etc/haproxy/maps/rome-mbc-int-klp-starixplay-com.map)] if { hdr(host) -i mbc-int-klp.starixplay.com }
    use_backend %[path,lower,map_reg(/etc/haproxy/maps/rome-789y-mb-klp-starixplay-com.map)] if { hdr(host) -i 789y-mb-klp.starixplay.com -i 789y-mb2-klp.starixplay.com }
    use_backend %[path,lower,map_reg(/etc/haproxy/maps/rome-indo-mb-klp-starixplay-com.map)] if { hdr(host) -i indo-mb-klp.starixplay.com -i indo-mb2-klp.starixplay.com }
    use_backend %[path,lower,map_reg(/etc/haproxy/maps/rome-mbc-mb-klp-starixplay-com.map)] if { hdr(host) -i mbc-mb-klp.starixplay.com -i mbc-mb2-klp.starixplay.com }
    use_backend %[path,lower,map_reg(/etc/haproxy/maps/rome-intp2-gatonic-com.map)] if { hdr(host) -i intp2.gatonic.com -i intp21.gatonic.com -i intp22.gatonic.com -i intp23.gatonic.com -i intp24.gatonic.com -i intp2.726872.com -i intp21.726872.com -i intp22.726872.com -i intp23.726872.com -i intp24.726872.com -i intp2.focapts.com -i intp21.focapts.com -i intp22.focapts.com -i intp23.focapts.com -i intp24.focapts.com }
    use_backend %[path,lower,map_reg(/etc/haproxy/maps/rome-intp3-gatonic-com.map)] if { hdr(host) -i intp3.gatonic.com -i intp31.gatonic.com -i intp32.gatonic.com -i intp33.gatonic.com -i intp34.gatonic.com -i intp3.726872.com -i intp31.726872.com -i intp32.726872.com -i intp33.726872.com -i intp34.726872.com -i intp3.focapts.com -i intp31.focapts.com -i intp32.focapts.com -i intp33.focapts.com -i intp34.focapts.com }
    use_backend %[req.hdr(host),lower,map_dom(/etc/haproxy/maps/hosts.map)]

default_backend nexops_default_backend_svc_be
