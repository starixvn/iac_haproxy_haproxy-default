frontend status-monitor
	bind *:8001
	monitor-uri	/checkstatus

frontend http_in_alpha
    bind *:80
    mode http
    option forwardfor
    option httplog
    capture request header Host len 30
    capture request header User-Agent len 200
    capture request header Referer len 800
    capture request header X-Forwarded-For len 20
    option http-keep-alive
    stats enable
    stats uri /stats
    stats refresh 300s
    stats show-legends
    stats show-node
    stats auth nexcel:NexOps!QAZ
    ###
    use_backend %[path,lower,map_reg(/etc/haproxy/maps/rome-api-ultra88-com.map)] if { hdr(host) -i api.ultra88.com }
    use_backend %[path,lower,map_reg(/etc/haproxy/maps/rome-api-file678-com.map)] if { hdr(host) -i api.file678.com }
    use_backend %[path,lower,map_reg(/etc/haproxy/maps/rome-portal-apis-prod-nebula-prod.map)] if { hdr(host) -i portal-apis-prod.nebula.prod }
    use_backend %[path,lower,map_reg(/etc/haproxy/maps/staging-y1-int.gatonic.com.map)] if { hdr(host) -i staging-y1-int.gatonic.com staging-y1-ex.gatonic.com }
    use_backend %[path,lower,map_reg(/etc/haproxy/maps/staging-y7-int.gatonic.com.map)] if { hdr(host) -i staging-y7-int.gatonic.com staging-y7-ex.gatonic.com }
    use_backend %[path,lower,map_reg(/etc/haproxy/maps/staging-y11-int.gatonic.com.map)] if { hdr(host) -i staging-y11-int.gatonic.com staging-y11-ex.gatonic.com }
    use_backend %[path,lower,map_reg(/etc/haproxy/maps/int1.gatonic.com.map)] if { hdr(host) -i int1.gatonic.com }
    use_backend %[path,lower,map_reg(/etc/haproxy/maps/int7.gatonic.com.map)] if { hdr(host) -i int7.gatonic.com }
    use_backend %[path,lower,map_reg(/etc/haproxy/maps/int11.gatonic.com.map)] if { hdr(host) -i int11.gatonic.com }
    use_backend %[path,lower,map_reg(/etc/haproxy/maps/int5.gatonic.com.map)] if { hdr(host) -i int5.gatonic.com }
    use_backend %[path,lower,map_reg(/etc/haproxy/maps/int4.gatonic.com.map)] if { hdr(host) -i int4.gatonic.com }
    ##
    use_backend %[path,lower,map_reg(/etc/haproxy/maps/rome-mbp1-gatonic-com.map)] if { hdr(host) -i mbp1.gatonic.com -i idp1.gatonic.com -i mb.li88ag.com -i mb2.li88ag.com -i mb.mu88ag.com -i mb2.mu88ag.com -i mb.wi43ver.com -i mb2.wi43ver.com -i mbp2.gatonic.com -i mbp3.gatonic.com }
    use_backend %[path,lower,map_reg(/etc/haproxy/maps/rome-intp1-gatonic-com.map)] if { hdr(host) -i intp1.gatonic.com -i intp11.gatonic.com -i intp12.gatonic.com -i intp13.gatonic.com -i intp14.gatonic.com }
    use_backend %[path,lower,map_reg(/etc/haproxy/maps/rome-mbp2-gatonic-com.map)] if { hdr(host) -i mbp2.gatonic.com -i idp2.gatonic.com }
    use_backend %[path,lower,map_reg(/etc/haproxy/maps/rome-intp2-gatonic-com.map)] if { hdr(host) -i intp2.gatonic.com -i intp21.gatonic.com -i intp22.gatonic.com -i intp23.gatonic.com -i intp24.gatonic.com -i intp2.726872.com -i intp21.726872.com -i intp22.726872.com -i intp23.726872.com -i intp24.726872.com -i intp2.focapts.com -i intp21.focapts.com -i intp22.focapts.com -i intp23.focapts.com -i intp24.focapts.com }
    use_backend %[path,lower,map_reg(/etc/haproxy/maps/rome-mbp3-gatonic-com.map)] if { hdr(host) -i mbp3.gatonic.com -i idp3.gatonic.com }
    use_backend %[path,lower,map_reg(/etc/haproxy/maps/rome-intp3-gatonic-com.map)] if { hdr(host) -i intp3.gatonic.com -i intp31.gatonic.com -i intp32.gatonic.com -i intp33.gatonic.com -i intp34.gatonic.com }
    use_backend %[path,lower,map_reg(/etc/haproxy/maps/rome-mbp4-gatonic-com.map)] if { hdr(host) -i mbp4.gatonic.com -i idp4.gatonic.com }
    use_backend %[path,lower,map_reg(/etc/haproxy/maps/rome-mb-li88ag-com.map)] if { hdr(host) -i mb.li88ag.com -i mb2.li88ag.com -i mb.mu88ag.com -i mb2.mu88ag.com -i mb.wi43ver.com -i mb2.wi43ver.com }
    use_backend %[req.hdr(host),lower,map_dom(/etc/haproxy/maps/hosts.map)]

default_backend default_backend_nodes
