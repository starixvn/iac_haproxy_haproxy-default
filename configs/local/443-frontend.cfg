frontend https_in
    bind *:443 ssl crt /usr/local/etc/haproxy/nexdev.net.pem alpn h2,http/1.1 crt /usr/local/etc/haproxy/nexcel.vn.pem alpn h2,http/1.1 crt /usr/local/etc/haproxy/nexcel.info.pem alpn h2,http/1.1
    mode http
    option forwardfor
    capture request header Host len 30
    capture request header User-Agent len 200
    capture request header Referer len 800
    capture request header X-Forwarded-For len 20
    option http-keep-alive
    http-request set-header X-Forwarded-Proto https if { ssl_fc }
    redirect scheme https code 301 if !{ ssl_fc }
    stats uri /stats
    stats refresh 300s
    stats show-legends
    stats show-node
    stats auth nexcel:1qaz@WSX
    use_backend nexus_nexcel_redmine_PROD_be if { hdr(host) -i nexdev.net }
    use_backend rome_alpha_reports_LOCAL_be if { path_beg /reports/ } { hdr(host) -i mb3.nexdev.net }
    use_backend rome_alpha_assets_LOCAL_2_be if { path_beg /assets/ } { hdr(host) -i mb2.nexdev.net }
    use_backend rome_alpha_assets_LOCAL_3_be if { path_beg /assets/ } { hdr(host) -i mb3.nexdev.net }
    use_backend rome_alpha_beforelogin_LOCAL_2_be if { path_beg /Local02/ } { hdr(host) -i alpha.nexdev.net }
    use_backend rome_alpha_beforelogin_LOCAL_3_be if { path_beg /Local03/ } { hdr(host) -i alpha.nexdev.net }
    use_backend rome_alpha_reports_LOCAL_be if { path_beg /reports/ } { hdr(host) -i nex3-i7.nexdev.net }
    use_backend rome_alpha_reports_LOCAL_be if { path_beg /reports/ } { hdr(host) -i nex3-i1.nexdev.net }
    use_backend be_static if { path_beg /static/ } { hdr(host) -i mb3.nexdev.net }
    use_backend %[path,lower,map_reg(/etc/haproxy/maps/olympus-proxy.map)] if { hdr(host) -i settle.nexdev.net }
    use_backend %[path,lower,map_reg(/etc/haproxy/maps/olympus-proxy-tvs.map)] if { hdr(host) -i tvs.nexdev.net }
    use_backend %[path,lower,map_reg(/etc/haproxy/maps/olympus-proxy-owp.map)] if { hdr(host) -i owp.nexdev.net }
    use_backend %[path,lower,map_reg(/etc/haproxy/maps/olympus-proxy-riskcontrol.map)] if { hdr(host) -i nap-riskcontrol-netcore.nexdev.net }
    use_backend %[path,lower,map_reg(/etc/haproxy/maps/vg3-game-proxy.map)] if { hdr(host) -i l3-api-proxy.nexdev.net }
    use_backend %[path,lower,map_reg(/etc/haproxy/maps/nexops-path.map)] if { hdr(host) -i sample.nexdev.net }
    use_backend %[req.hdr(host),lower,map_dom(/etc/haproxy/maps/hosts.map)]

default_backend default_backend_nodes
