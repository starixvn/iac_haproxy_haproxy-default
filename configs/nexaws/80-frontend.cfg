frontend status-monitor
	bind *:8001
	monitor-uri	/checkstatus
    http-request use-service prometheus-exporter if { path /metrics }

frontend http_in
    bind *:80
    mode http
    option forwardfor
    option httplog
    capture request header Host len 30
    capture request header User-Agent len 200
    capture request header Referer len 800
    capture request header X-Forwarded-For len 20
    http-request redirect scheme https unless { ssl_fc }
    http-request redirect scheme https code 301 unless { ssl_fc }
    option http-keep-alive
    monitor-uri	/checkstatus
    http-request use-service prometheus-exporter if { path /metrics }
    stats enable
    stats uri /stats
    stats refresh 300s
    stats show-legends
    stats show-node
    stats auth nexcel:NexOps!QAZ
    ###
    acl is_well_known path_beg -i /.well-known/
    use_backend letsencrypt if is_well_known
    ###
    #acl is_whitelisted_ip src -f /etc/haproxy/whitelisted.ips
    #acl internal_domains hdr(host) -i nexdev.net nexcel.info info.lumiplus.vn goal.nexdev.net goal.lumiplus.vn fb-hrm-webservice.nexdev.net fb-hrm-webservice.lumiplus.vn 
    acl internal_domains hdr(host) -i nexdev.net nexcel.info info.lumiplus.vn  fb-hrm-webservice.nexdev.net fb-hrm-webservice.lumiplus.vn # open Goal EPA Public all
    #http-request deny if internal_domains !is_whitelisted_ip
    use_backend nexus_nexcel_redmine_NEXAWS_be if { hdr(host) -i nexdev.net }
    use_backend %[req.hdr(host),lower,map_dom(/etc/haproxy/maps/hosts.map)]

default_backend default_backend_nodes
