frontend http_in_8088
  bind *:8088
  mode http
  option forwardfor
  option dontlog-normal
  capture request header Host len 30
  capture request header User-Agent len 200
  capture request header Referer len 800
  capture request header X-Forwarded-For len 20
  stats enable
  stats uri /stats
  stats refresh 300s
  stats show-legends
  stats show-node
  stats auth nexcel:NexOps!QAZ
  http-request use-service prometheus-exporter if { path /metrics }
  monitor-uri	/checkstatus
  #compression algo gzip

    use_backend %[path,lower,map_reg(/etc/haproxy/maps/rome-naphub-byb6181-com.map)] if { hdr(host) -i naphub.byb6181.com }
    use_backend %[path,lower,map_reg(/etc/haproxy/maps/spu-cts-api-starix-klprod-gamora-prod.map)] if { hdr(host) -i cts-api.starix-klprod.gamora.prod }
    use_backend %[req.hdr(host),lower,map_dom(/etc/haproxy/maps/hosts.map)]
  #use_backend nexus_saba_sports_saba_news_site_PROD_be if { hdr(host) -i saba.vn }
  #use_backend nexus_saba_sports_saba_news_site_PROD_be if { hdr(host) -i www.saba.vn }

default_backend default_backend_nodes
