frontend status-monitor
	bind *:8001
	monitor-uri	/checkstatus
    option dontlog-normal
    http-request use-service prometheus-exporter if { path /metrics }
default_backend default_backend_nodes

frontend http_in
    bind *:80
    mode http
    option dontlog-normal
    option forwardfor
    capture request header Host len 30
    capture request header User-Agent len 200
    capture request header Referer len 800
    capture request header X-Forwarded-For len 20
    http-request use-service prometheus-exporter if { path /metrics }
    stats enable
    stats uri /stats
    stats refresh 300s
    stats show-legends
    stats show-node
    stats auth nexcel:NexOps!QAZ

    #use_backend %[path,lower,map_reg(/etc/haproxy/maps/olympus-proxy-tvs.map)] if { hdr(host) -i tvs.oneops.net -i tvs2.oneops.net }
    use_backend %[path,lower,map_reg(/etc/haproxy/maps/olympus-proxy-owp.map)] if { hdr(host) -i owp.oneops.net -i owp2.oneops.net -i owp3.oneops.net }
    use_backend %[path,lower,map_reg(/etc/haproxy/maps/rome-portal-apis-prod-nebula-prod.map)] if { hdr(host) -i portal-apis-prod.nebula.prod }
    use_backend %[path,lower,map_reg(/etc/haproxy/maps/nexus-portal-1100011-com.map)] if { hdr(host) -i portal.1100011.com -i feeds.12bet.com -i feeds.12ying.com -i dafabet.1100011.com }
    use_backend %[req.hdr(host),lower,map_dom(/etc/haproxy/maps/hosts.map)]
default_backend default_backend_nodes
